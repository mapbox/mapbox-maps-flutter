name: mapbox_maps_flutter
description: "Official Mapbox Maps SDK for Flutter. Add an interactive map widget that renders Mapbox Vector Tile (MVT) maps. Customize it for Android, iOS, and Web."
version: 3.0.0-alpha.29
homepage: https://www.mapbox.com/maps
repository: https://github.com/mapbox/mapbox-maps-flutter
issue_tracker: https://github.com/mapbox/mapbox-maps-flutter/issues
topics:
  - mapbox
  - map
  - maps
  - vector-tiles
  - mvt
screenshots:
  - description: "The same map renders on all supported platforms from one Flutter codebase."
    path: screenshots/cross_platform_eiffel_tower.webp
  - description: "Standard, Streets, Light, Dark, and Satellite Streets styles, shown over Turku, Finland."
    path: screenshots/map_styles_turku.webp

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

resolution: workspace

dependencies:
  turf: ^0.0.10
  meta: ^1.17.0
  flutter:
    sdk: flutter
  mapbox_maps_flutter_platform_interface: ^3.0.0-alpha.29
  mapbox_maps_flutter_mobile: ^3.0.0-alpha.29
  mapbox_maps_flutter_web: ^3.0.0-alpha.29

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        default_package: mapbox_maps_flutter_mobile
      ios:
        default_package: mapbox_maps_flutter_mobile
      web:
        default_package: mapbox_maps_flutter_web
